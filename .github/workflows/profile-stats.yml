name: Profile stats

# Régénère assets/stats.svg (statistiques du profil, style terminal) chaque jour.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/profile-stats.mjs
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Générer les statistiques
        run: node .github/scripts/profile-stats.mjs
        env:
          # Jeton personnel facultatif (inclut les dépôts privés) ; repli sur le jeton du workflow.
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: ${{ github.repository_owner }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git diff --staged --quiet || { git commit -m "chore(stats): mettre à jour les statistiques du profil" && git push; }
