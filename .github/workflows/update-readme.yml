name: Update README with Project Stats

on:
  schedule:
    # Exécute tous les jours à 6h UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-js-version: "18"

      - name: Install dependencies
        run: |
          npm init -y
          npm install @octokit/rest date-fns

      - name: Generate Project Stats
        run: node .github/scripts/generate-stats.js
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}

      - name: Update README
        run: node .github/scripts/update-readme.js

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --staged --quiet || git commit -m "🤖 Update README with latest project stats"
          git push
