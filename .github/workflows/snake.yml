name: Snake

# Génère l'animation « snake » de la grille de contributions aux couleurs Nuit & Or,
# publiée sur la branche output (affichée dans le README).
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Générer le snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-nuit-or.svg?palette=github-dark&color_snake=#D4A017&color_dots=#0B1220,#3B2F0B,#6B4F0C,#A8800F,#D4A017

      - name: Publier sur la branche output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
