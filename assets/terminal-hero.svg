  <desc id="desc">Mike E.S. Chokki, Fondateur de LucidForge Africa, Back-End Engineer et Architecte. Systèmes distribués, Go, Java Spring Boot, Laravel, Flutter. Basé à Dakar et Cotonou.</desc>
  <style>
